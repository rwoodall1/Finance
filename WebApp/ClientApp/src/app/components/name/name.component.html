

<mat-spinner *ngIf="!loaded"  class="custom-spinner" color="primary" diameter="40"></mat-spinner>

<form  role="form" class="form-horizontal" name="chartAccountForm" #chartAccountForm="ngForm" novalidate>
  <div style="text-align:center">
    <h2>Names</h2>
    
  </div>
  <div class="row">
    <table *ngIf="dataSource1?.filteredData?.length>0" mat-table style="height:65%" [dataSource]="dataSource1">
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>InActive  </th>
        <td mat-cell *matCellDef="let element;let i= index">
          <mat-checkbox [disabled]="true" name="clr1"
                        [ngModelOptions]="{standalone: true}"
                        [(ngModel)]="element.inActive">
          </mat-checkbox>
      </ng-container>

      

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element">
          <a [routerLink]="[]" (click)="editName(element.id)">{{element.fullName}} </a>
         
</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Email </th>
        <td mat-cell *matCellDef="let element"> {{element.emailAddress}} </td>
      </ng-container>


      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef> Phone </th>
        <td mat-cell *matCellDef="let element">
          {{element.phoneNumber}}
        </td>
      </ng-container>


      <ng-container matColumnDef="mobilePhone">
        <th mat-header-cell *matHeaderCellDef> Mobil No. </th>
        <td mat-cell *matCellDef="let element"> {{element.mobilePhone}} </td>
      </ng-container>

      <tr mat-header-row class="tablerow" *matHeaderRowDef="columnsToDisplay"></tr>

      <tr mat-row (dblclick)=" edit($event,element)" *matRowDef="let element; columns: columnsToDisplay;"
          class="example-element-row tablerow">
      </tr>

    </table>
    <mat-paginator [pageSizeOptions]="[5,10,15,20]" showFirstLastButtons> </mat-paginator>
  </div>
</form>
